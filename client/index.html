<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>DSCVR — Compliance Navigator</title>
    <meta name="description" content="DSCVR Compliance Navigator - Seven-Gate Compliance Journey for Bali Villa Operations" />
    <meta property="og:title" content="DSCVR — Compliance Navigator" />
    <meta property="og:description" content="Seven-Gate Compliance Journey for Bali Villa Operations. Navigate zoning, licensing, tax, and OTA verification requirements." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      try {
        var t = localStorage.getItem('dscvr-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          var r = document.documentElement;
          r.style.setProperty('--bg', '#07101E');
          r.style.setProperty('--surface', '#0C1A2E');
          r.style.setProperty('--txt', '#F1F5F9');
          r.style.setProperty('--accent', '#14B8A6');
        } else {
          r = document.documentElement;
          r.style.setProperty('--bg', '#F7F8FA');
          r.style.setProperty('--surface', '#FFFFFF');
          r.style.setProperty('--txt', '#0F1923');
          r.style.setProperty('--accent', '#E8192C');
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
